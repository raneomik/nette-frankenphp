# /srv/rpsls/litestream.yml — sur le VPS, lu par le service litestream (compose.yaml)
# Réplique en continu var/data/app.db (volume "data", monté sur /data) ; les ${VAR} viennent
# de litestream.env. https://litestream.io
dbs:
  - path: /data/app.db
    replica:
      url: ${LITESTREAM_REPLICA_URL}
      # envoi des changements toutes les 10 s (défaut : 1 s) : au pire 10 s d'écritures
      # perdues si le VPS disparaît, ~10x moins de requêtes vers le stockage (quotas gratuits)
      sync-interval: 10s

# Fenêtre de restauration : un instantané complet par jour, gardé 7 jours (défaut : 24 h).
# Précision : la seconde sur les 5 dernières minutes, ~30 s au-delà (fichiers compactés,
# gardés aussi longtemps que le plus vieil instantané).
snapshot:
  interval: 24h
  retention: 168h
