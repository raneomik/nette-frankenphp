# compose.yaml — on the VPS, in the project folder (VPS_PROJECT_DIR)
# No container_name nor ports: docker rollout must be able to run 2 instances
services:
  app:
    image: ghcr.io/raneomik/nette-frankenphp:${TAG:-latest}
    restart: unless-stopped
    env_file: app.env # app secrets (Mercure JWT keys...), separate from .env
    environment:
      # TLS is terminated by caddy-docker-proxy: plain HTTP, any host name
      SERVER_NAME: ":80"
      # = "iss" claim of the JWTs generated by nette-mercure (scheme + public domain)
      MERCURE_ISSUER: https://${HOST}
      # real client IP for Caddy/Mercure (subscription limits, logs)
      CADDY_GLOBAL_OPTIONS: |
        servers {
          trusted_proxies static private_ranges
        }
      CADDY_SERVER_LOG_OPTIONS: level ERROR
      # If you limit the container memory, align Go's GC with it:
      # GOMEMLIMIT: 450MiB
    # Only capability kept: listening on port 80 without being root
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    volumes:
      # no volume on /data: two instances cannot share mercure.db (lock)
      - sessions:/srv/var/temp/sessions
      - logs:/srv/var/log
      # SQLite database (+ -wal/-shm): the whole folder, not just the file; shared safely
      # by both instances of a rollout and litestream (same host, SQLite locks)
      - data:/srv/var/data
    networks: [caddy]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    labels:
      caddy: ${HOST}
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.reverse_proxy.lb_try_duration: 10s
      caddy.reverse_proxy.health_uri: /health
      caddy.reverse_proxy.health_interval: 10s

  # Continuous replication of the database to an external storage: point-in-time restore
  # over 7 days (litestream.yml). Outside the rollout: a single instance, never two.
  litestream:
    image: litestream/litestream:0.5.18
    # optional: started by deploy.sh only if litestream.env exists
    profiles: [backup]
    restart: unless-stopped
    command: replicate
    # same uid as the image's app user: the -wal/-shm files that litestream
    # sometimes recreates must stay writable by the app
    user: "1000:1000"
    env_file: litestream.env
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  caddy:
    external: true

volumes:
  sessions: {}
  logs: {}
  data: {}
