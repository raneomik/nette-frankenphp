services:
    app:
        build:
            context: .
            dockerfile: .docker/frankenphp/Dockerfile
            target: prod
            args:
                USER_ID: ${USER_ID:-1000}
                GROUP_ID: ${GROUP_ID:-1000}
        ports:
            - ${HTTP_PORT:-88}:80
            - ${HTTPS_PORT:-448}:443
        environment:
            APP_RUNNER: "frankenphp"
            FRANKENPHP_SITE_CONFIG: |
                worker {
                    file ./www/index.php
                }
            SERVER_NAME: localhost
            XDEBUG_MODE: "off"
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
            CADDY_SERVER_LOG_OPTIONS: level ERROR
        volumes:
            - ./var/:/srv/var
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: "3"
