services:
    app:
        build:
            context: .
            dockerfile: .docker/Dockerfile
        ports:
            - ${HTTP_PORT:-88}:80
            - ${HTTPS_PORT:-448}:443
            - ${XDEBUG_PORT:-9003}:9003
            - 9000:9000
        environment:
            APP_WORKER_MODE: 1
            FRANKENPHP_CONFIG: "worker /srv/www/index.php"
            SERVER_NAME: localhost
        volumes:
            - ./:/srv
            - .docker/Caddyfile:/etc/frankenphp/Caddyfile
