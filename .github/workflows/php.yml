name: "PHP"

on:
    push:
        branches: [ "**" ]

    schedule:
        -   cron: "0 8 * * 1"

permissions:
    contents: read

concurrency:
    group: php-${{ github.ref }}
    cancel-in-progress: true

jobs:
  php:
      runs-on: ubuntu-latest
      steps:
          -   name: Checkout
              uses: actions/checkout@v7

          -   name: Install PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.5
                  tools: composer:v2

          -   name: Setup problem matchers for PHP
              run: 'echo ::add-matcher::${{ runner.tool_cache }}/php.json'

          -   name: Install dependencies
              uses: ramsey/composer-install@4.0.0
              with:
                  composer-options: --prefer-dist

          -   name: Validate composer.json and composer.lock
              run: composer validate --strict --no-check-publish

          -   name: Composer dependencies audit
              run: composer audit

          -   name: Check PSR-4 autoloading
              run: composer dumpautoload --strict-psr -a -o --dev

          -   name: Easy coding standards
              run: vendor/bin/ecs -c .ecs.php

          -   name: Rector
              run: vendor/bin/rector --dry-run -c .rector.php --no-progress-bar

          -   name: PhpStan
              run: vendor/bin/phpstan analyse -c .phpstan.neon --error-format=github --no-progress
