name: Build & deploy

on:
  push:
    tags: ['v*.*.*'] # git tag v1.3.0 && git push origin v1.3.0
  # Bouton "Run workflow" (onglet Actions) : choisir un tag dans "Use workflow from"
  # pour redéployer cette version ; lancé depuis une branche, il construit l'image sans déployer.
  workflow_dispatch:

# Deux tags rapprochés : le second attend la fin du premier au lieu de déployer en parallèle
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # GHCR exige un nom en minuscules (metadata-action le met en minuscules lui-même)
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # autorise le GITHUB_TOKEN à pousser sur GHCR
    outputs:
      # tag v1.3.0 → "1.3.0" ; lancé depuis une branche → "sha-8f3c2a9"
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Déduit les tags de l'image du ref git. Pour le tag v1.3.0 :
      #   1.3.0, 1.3, sha-8f3c2a9, latest
      # Pour une pré-release v1.4.0-rc.1 : 1.4.0-rc.1, sha-8f3c2a9 (ni 1.4 ni latest)
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/frankenphp/Dockerfile
          target: prod
          platforms: linux/amd64 # linux/arm64 si le VPS est en ARM
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # labels OCI : version, révision git, date, source du dépôt…
          labels: ${{ steps.meta.outputs.labels }}
          # composer télécharge raneomik/nette-mercure (dev-main) via l'API GitHub :
          # authentifié, on n'est pas soumis à la limite anonyme partagée des runners
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}
          # réutilise les couches (vendor, node_modules...) d'un build à l'autre
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # seul un tag de version est déployé (un lancement manuel depuis une branche s'arrête au build)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rpsls.example.fr
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "/srv/rpsls/deploy.sh $VERSION"
