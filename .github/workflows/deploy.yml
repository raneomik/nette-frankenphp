name: Build & deploy

on:
  push:
    tags: ['v*.*.*'] # git tag v1.3.0 && git push origin v1.3.0
  # "Run workflow" button (Actions tab): pick a tag in "Use workflow from"
  # to redeploy that version; run from a branch, it builds the image without deploying.
  workflow_dispatch:

# Two tags close together: the second waits for the first to finish instead of deploying in parallel
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # GHCR requires a lowercase name (metadata-action lowercases it itself)
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allows the GITHUB_TOKEN to push to GHCR
    outputs:
      # tag v1.3.0 → "1.3.0"; run from a branch → "sha-8f3c2a9"
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Derives the image tags from the git ref. For the tag v1.3.0:
      #   1.3.0, 1.3, sha-8f3c2a9, latest
      # For a pre-release v1.4.0-rc.1: 1.4.0-rc.1, sha-8f3c2a9 (neither 1.4 nor latest)
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/frankenphp/Dockerfile
          target: prod
          platforms: linux/amd64 # linux/arm64 if the VPS runs on ARM
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # OCI labels: version, git revision, date, repository source…
          labels: ${{ steps.meta.outputs.labels }}
          # composer downloads raneomik/nette-mercure (dev-main) through the GitHub API:
          # authenticated, it is not subject to the runners' shared anonymous rate limit
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}
          # reuses the layers (vendor, node_modules...) from one build to the next
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # only a version tag is deployed (a manual run from a branch stops after the build)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rpsls.example.fr
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VERSION: ${{ needs.build.outputs.version }}
        run: ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" "/home/raneomik/frankenette/deploy.sh $VERSION"
