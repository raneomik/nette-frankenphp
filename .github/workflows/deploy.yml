name: Build & deploy

on:
  push:
    tags: ['v*.*.*'] # git tag v1.3.0 && git push origin v1.3.0
  # "Run workflow" button (Actions tab): pick a tag in "Use workflow from"
  # to redeploy that version; run from a branch, it builds the image without deploying.
  workflow_dispatch:

# Two tags close together: the second waits for the first to finish instead of deploying in parallel
concurrency:
  group: deploy-production
  cancel-in-progress: false

# No token rights unless a job asks for them
permissions: {}

env:
  # GHCR requires a lowercase name (metadata-action lowercases it itself)
  IMAGE: ghcr.io/${{ github.repository }}

# The deploy files (.docker/deploy) reach the VPS through rsync before each deployment
# (.docker/deploy/README.md, "Deploy files").
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # allows the GITHUB_TOKEN to push to GHCR
    outputs:
      # what deploy.sh receives: tag v1.3.0 → "1.3.0@sha256:…", the exact image just pushed
      # (a tag can be pushed again later, a digest cannot change)
      image: ${{ steps.meta.outputs.version }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Derives the image tags from the git ref. For the tag v1.3.0:
      #   1.3.0, 1.3, sha-8f3c2a9, latest
      # For a pre-release v1.4.0-rc.1: 1.4.0-rc.1, sha-8f3c2a9 (neither 1.4 nor latest)
      - id: meta
        uses: docker/metadata-action@v6
        env:
          # buildx pushes an index (image + provenance): GHCR reads the description from there
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          # shown on the GHCR package page (defaults to the repository description)
          labels: |
            org.opencontainers.image.description=Nette on FrankenPHP (worker mode) with Mercure, built from the nette-mercure-intergration branch
          annotations: |
            org.opencontainers.image.description=Nette on FrankenPHP (worker mode) with Mercure, built from the nette-mercure-intergration branch

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/frankenphp/Dockerfile
          target: prod
          platforms: linux/amd64 # linux/arm64 if the VPS runs on ARM
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # OCI labels: version, git revision, date, repository source…
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # composer downloads raneomik/nette-mercure (dev-main) through the GitHub API:
          # authenticated, it is not subject to the runners' shared anonymous rate limit
          secrets: |
            composer_auth={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}
          # reuses the layers (vendor, node_modules...) from one build to the next
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # only a version tag is deployed (a manual run from a branch stops after the build)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://frankenette.raneomik.fr
    env:
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PROJECT_DIR: ${{ secrets.VPS_PROJECT_DIR }}
      IMAGE_VERSION: ${{ needs.build.outputs.image }}

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before deploying: the deploy.sh that runs next is the one of this version, even when it
      # changes what it accepts. The key's forced command (ssh-dispatch, README) hands rsync to
      # rrsync, rooted at the project folder: hence the empty destination path. Secrets untouched.
      - name: Sync deploy files
        run: |
          rsync -rc --exclude README.md \
            -e "ssh -i $HOME/.ssh/deploy_key -p ${VPS_PORT:-22} -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            .docker/deploy/ "$VPS_USER@$VPS_HOST:"

      # Runs deploy.sh in the project folder of the VPS (VPS_PROJECT_DIR). The key's forced command
      # runs it anyway and deploy.sh reads the version from the last word: this command works with
      # or without that restriction.
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" "$VPS_PROJECT_DIR/deploy.sh $IMAGE_VERSION"

      # From the outside, through DNS, TLS and caddy-docker-proxy: what a visitor gets
      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl -fsS --max-time 10 "$APP_URL/health" && exit 0
            sleep 5
          done
          echo "::error::$APP_URL/health does not answer after the deployment"
          exit 1
